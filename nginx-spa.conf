# Configuração nginx — TrancosoBA (SPA + proteção de imagens + segurança)
# Incluir dentro do bloco server {} do site.

# Cabeçalhos de segurança (todas as respostas)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Fallback de SPA
location / {
  try_files $uri $uri/ /index.html;
}

# Cache agressivo para assets imutáveis gerados pelo Vite (hash no nome)
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# Cache longo para imagens otimizadas
location /img/ {
  expires 30d;
  add_header Cache-Control "public";

  # Proteção de hotlink das fotos: só o próprio domínio pode embutir
  valid_referers none blocked trancosoba.com *.trancosoba.com trancosoba.com.br *.trancosoba.com.br;
  if ($invalid_referer) { return 403; }
  # Listagem de diretório desativada (padrão do nginx é off; reforçando)
  autoindex off;
}
